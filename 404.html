<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/appdock-icon.svg?v=2" type="image/svg+xml" sizes="any" />
    <link rel="alternate icon" href="/favicon.ico?v=2" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2" />
    <title>Page not found — AppDock</title>
    <style>
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; color: #1a1a1a; background: #fafaf7; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(560px, calc(100% - 40px)); }
      p:first-child { color: #f28c3a; font-size: 12px; font-weight: 700; letter-spacing: 1.6px; }
      h1 { margin: 14px 0; font-size: clamp(42px, 10vw, 72px); line-height: 1; letter-spacing: -0.05em; }
      p { color: #736a61; line-height: 1.7; }
      a { display: inline-block; margin-top: 22px; padding: 12px 18px; color: #fff; border-radius: 8px; background: #1a1a1a; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p>APPDOCK / 404</p>
      <h1>Page not found.</h1>
      <p>这个页面不存在，或者地址已经发生变化。</p>
      <a href="/">返回 AppDock</a>
    </main>
  </body>
</html>
